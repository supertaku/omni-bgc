name: Controlled Android release verification

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full clean source commit SHA to build
        required: true
        type: string
      compare_clean_builds:
        description: Build twice and compare APK bytes
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Validate exact source revision
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Confirm clean checkout
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.11.1
          cache: npm
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13.9'
          cache: pip
          cache-dependency-path: scripts/map-requirements.txt
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21.0.5+11'
      - run: npm ci
      - run: python -m pip install -r scripts/map-requirements.txt
      - run: npm run typecheck
      - run: npm run lint
      - run: node scripts/build-preview.cjs
      - run: npm run check:host
      - run: npm run check:geo
      - run: git diff --quiet -- assets/generated/preview
      - name: Install pinned Android SDK inputs
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'
      - name: Generate native Android project
        run: npx --no-install expo prebuild --platform android --clean --no-install
      - name: Build ARM64 release
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers 2 -PreactNativeArchitectures=arm64-v8a -Pkotlin.compiler.execution.strategy=in-process
      - name: Verify APK and summarize provenance
        run: |
          python scripts/verify-android-artifact.py android/app/build/outputs/apk/release/app-release.apk --require-clean --expected-signer-sha256 fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c --report "$RUNNER_TEMP/android-release.json"
          echo '### Verified internal preview build' >> "$GITHUB_STEP_SUMMARY"
          echo 'APK remains on the runner. No artifact is uploaded or published.' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/android-release.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve first clean APK and signer for comparison
        if: inputs.compare_clean_builds
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/first.apk"
          cp android/app/debug.keystore "$RUNNER_TEMP/debug.keystore"
      - name: Second clean build from the same inputs
        if: inputs.compare_clean_builds
        run: |
          git worktree add --detach "$RUNNER_TEMP/omni-second-source" "$(git rev-parse HEAD)"
          cd "$RUNNER_TEMP/omni-second-source"
          npm ci
          npx --no-install expo prebuild --platform android --clean --no-install
          cp "$RUNNER_TEMP/debug.keystore" android/app/debug.keystore
          (cd android && ./gradlew :app:assembleRelease --no-daemon --max-workers 2 -PreactNativeArchitectures=arm64-v8a -Pkotlin.compiler.execution.strategy=in-process)
          python scripts/verify-android-artifact.py android/app/build/outputs/apk/release/app-release.apk --require-clean --expected-signer-sha256 fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c --report "$RUNNER_TEMP/android-release-second.json"
      - name: Compare byte reproducibility
        if: inputs.compare_clean_builds
        run: |
          python scripts/compare-android-apks.py "$RUNNER_TEMP/first.apk" "$RUNNER_TEMP/omni-second-source/android/app/build/outputs/apk/release/app-release.apk" --report "$RUNNER_TEMP/android-reproducibility.json" || result=$?
          echo '### Byte reproducibility investigation' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/android-reproducibility.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit ${result:-0}
