name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned GIS test libraries
        run: python -m pip install Shapely==2.2.0 pyproj==3.7.2

      - name: Install pinned PostgreSQL syntax parser
        run: python -m pip install -r packages/database/canonical/requirements-syntax.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install mobile JavaScript dependencies
        run: npm ci --prefix apps/mobile

      - name: Typecheck mobile application
        run: npm run typecheck --prefix apps/mobile

      - name: Governance and contract suites
        run: |
          python -m unittest discover -v -s pipelines/sources -p 'test_governance.py'
          python -m unittest discover -v -s tests/data-quality/m1

      - name: Synthetic GIS and intake suites
        run: |
          python -m unittest discover -v -s tests/data-quality/m3
          python -m unittest discover -v -s tests/routing/m3
          python -m unittest discover -v -s tests/data-quality/m4
          python -m unittest discover -v -s tests/data-quality/research
          python -m unittest discover -v -s tests/data-quality/research-gis
          python -m unittest discover -v -s tests/data-quality/retrieval
          python -m unittest discover -v -s tests/data-quality/canonical

      - name: Mobile database projection suite
        run: python -m unittest discover -v -s tests/data-quality/mobile

      - name: Mobile JavaScript contracts and routing
        run: |
          node --test tests/map/mobile/layer-compatibility.test.cjs
          node tests/data-quality/mobile/contracts.mjs
          node tests/data-quality/mobile/resume.mjs
          node --test tests/data-quality/mobile/retrieval.mjs
          node --test tests/routing/mobile/engine.test.cjs tests/routing/mobile/loader.test.cjs
          node --test packages/ui/test/*.test.mjs
          node --test docs/evaluations/mobile-ui/test-itinerary.cjs

      - name: Strict domain, geo, and routing typecheck
        run: >-
          apps/mobile/node_modules/.bin/tsc --strict --noEmit --skipLibCheck
          --target ES2022 --module ESNext --moduleResolution bundler
          packages/domain/index.ts packages/geo/index.ts
          packages/routing/index.ts packages/routing/progress.ts
