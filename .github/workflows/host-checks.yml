name: Host checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.11.1
          cache: npm
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13.9'
          cache: pip
          cache-dependency-path: scripts/map-requirements.txt
      - run: npm ci
      - run: python -m pip install -r scripts/map-requirements.txt
      - run: npm run typecheck
      - run: npm run lint
      - run: node scripts/build-preview.cjs
      - run: npm run check:host
      - run: npm run check:geo
      - run: git diff --quiet -- assets/generated/preview
