name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned GIS test libraries
        run: python -m pip install Shapely==2.2.0 pyproj==3.7.2

      - name: Install pinned PostgreSQL syntax parser
        run: python -m pip install -r packages/database/canonical/requirements-syntax.txt

      - name: Install pinned Python quality tool
        run: python -m pip install -r requirements-quality.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install mobile JavaScript dependencies
        run: npm ci --prefix apps/mobile

      - name: Prepare empty private research projection
        env:
          CI: 'true'
        run: python pipelines/etl/offices/mobile_research.py --empty

      - name: Shared portable quality registry
        env:
          CI: 'true'
        run: python apps/mobile/scripts/quality.py --output .g/quality-ci

      - name: Retain synthetic quality results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-quality-results
          path: .g/quality-ci/
          if-no-files-found: error
          retention-days: 14
